# Actualiza las webs de licitaciones (una por sector) cada mañana y envía las alertas a los suscriptores.
name: Web y alertas

on:
  schedule:
    - cron: "20 5 * * *"   # 07:20 en Madrid (horario de verano), 06:20 en invierno
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  URL_WEB: https://ijfa1982.github.io/licitaciones-energia

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAY_SUSCRIPTORES: ${{ secrets.SUSCRIPTORES != '' }}
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Descargar licitaciones del día
        run: python -m web.generar_datos --salida web/build --privado web/privado
      - name: Generar el mapa de España
        run: python -m web.mapa
      - name: Descargar fotos y créditos (Wikimedia Commons)
        run: python -m web.fotos
      - name: Montar las webs de cada sector
        run: python -m web.construir
      - name: Enviar alertas a los suscriptores
        if: ${{ env.HAY_SUSCRIPTORES == 'true' }}
        continue-on-error: true   # un fallo de correo no debe impedir actualizar la web
        env:
          SUSCRIPTORES: ${{ secrets.SUSCRIPTORES }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REMITENTE: ${{ secrets.REMITENTE }}
        run: python -m web.enviar_alertas --privado web/privado
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: despliegue
        uses: actions/deploy-pages@v4
